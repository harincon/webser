<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GameCampus · Portal académico</title>
  <meta name="description" content="Portal académico con estética de videojuegos: login, matrícula, notas, promedio y horario.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <script>try{if(localStorage.getItem('gc-theme2')!=='dark')document.documentElement.setAttribute('data-theme','light')}catch(e){document.documentElement.setAttribute('data-theme','light')}</script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- ===================== LOGIN (arcade estilo Pac-Man) ===================== -->
<main id="login" class="screen login-screen">
  <div class="maze" aria-hidden="true">
    <i class="wall w1"></i><i class="wall w2"></i><i class="wall w3"></i><i class="wall w4"></i>
    <div class="track t-top">
      <div class="eaten"></div>
      <div class="runner">
        <span class="ghost g-red"></span><span class="ghost g-pink"></span><span class="ghost g-cyan"></span><span class="pac"></span>
      </div>
    </div>
    <div class="track t-bottom flip">
      <div class="eaten"></div>
      <div class="runner">
        <span class="ghost scared"></span><span class="ghost scared"></span><span class="ghost scared"></span><span class="pac"></span>
      </div>
    </div>
  </div>

  <section class="cabinet" id="cabinet" aria-labelledby="loginTitle">
    <p class="score-line"><span>1UP <b>004350</b></span><span class="hi">HI-SCORE <b>999999</b></span></p>
    <h1 class="logo" id="loginTitle">GAME<span>CAMPUS</span></h1>
    <p class="blink start-hint">PRESS START</p>

    <form id="loginForm" novalidate>
      <label for="user">Jugador (código o correo)</label>
      <input id="user" name="user" autocomplete="username" placeholder="Ej. 202510842" aria-describedby="loginError">

      <label for="password">Contraseña</label>
      <div class="pw-row">
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Tu contraseña" aria-describedby="loginError">
        <button type="button" class="ghost-btn" id="togglePw" aria-label="Mostrar contraseña">👁</button>
      </div>

      <p id="loginError" class="form-error" role="alert" aria-live="assertive"></p>

      <button type="submit" class="px-btn gold big" id="loginBtn">▶ ENTRAR</button>

      <div class="demo-box">
        <span>ACCESO DE PRUEBA</span>
        <code>202510842</code> <i>/</i> <code>campus2025</code>
        <button type="button" class="ghost-btn" id="fillDemo">Autocompletar</button>
      </div>
    </form>
    <p class="credit-line">INSERT COIN · © 2026 GAMECAMPUS</p>
  </section>

  <div class="ready" id="ready" hidden aria-live="polite"><strong>READY!</strong></div>
</main>

<!-- ===================== PORTAL ===================== -->
<div id="app" class="app" hidden>
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="brand-coin">GC</span><strong class="lbl">Game<em>Campus</em></strong></div>

    <div class="player">
      <span class="p1">P1</span>
      <div class="lbl"><strong id="playerName"></strong><span id="playerMeta"></span></div>
    </div>

    <nav aria-label="Navegación principal" id="nav">
      <span class="nav-cap">SELECCIONA NIVEL</span>
      <button data-view="home" data-tip="Inicio"><span class="ico" data-ico="home"></span><span class="lbl">Inicio</span></button>
      <button data-view="enrollment" data-tip="Matrícula"><span class="ico" data-ico="cube"></span><span class="lbl">Matrícula</span></button>
      <button data-view="grades" data-tip="Notas"><span class="ico" data-ico="crown"></span><span class="lbl">Notas</span></button>
      <button data-view="schedule" data-tip="Horario"><span class="ico" data-ico="calendar"></span><span class="lbl">Horario</span></button>
    </nav>

    <div class="side-foot">
      <button class="sound-btn" id="soundBtn" aria-pressed="false" data-tip="Sonido"><span class="ico" data-ico="soundOn"></span><span class="lbl">Sonido</span></button>
      <button class="logout-btn" id="logoutBtn" data-tip="Cerrar sesión"><span class="ico" data-ico="logout"></span><span class="lbl">Cerrar sesión</span></button>
      <button class="collapse-btn" id="collapseBtn" aria-expanded="true" data-tip="Minimizar menú"><span class="ico" data-ico="collapse"></span><span class="lbl">Minimizar</span></button>
      <p class="ver lbl">PERIODO <span id="periodLabel"></span> · v1.0</p>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div><span class="crumb">GAMECAMPUS /</span> <strong id="crumb"></strong></div>
      <div class="top-right">
        <span class="chip">PERIODO <b id="periodChip"></b></span>
        <button class="icon-btn" id="themeBtn" type="button" aria-label="Cambiar a modo claro" title="Modo claro"><span class="ico" data-ico="sun"></span></button>
      </div>
    </header>
    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <nav class="bottom-nav" id="bottomNav" aria-label="Navegación móvil">
    <button data-view="home"><span class="ico" data-ico="home"></span><span>Inicio</span></button>
    <button data-view="enrollment"><span class="ico" data-ico="cube"></span><span>Matrícula</span></button>
    <button data-view="grades"><span class="ico" data-ico="crown"></span><span>Notas</span></button>
    <button data-view="schedule"><span class="ico" data-ico="calendar"></span><span>Horario</span></button>
    <button id="logoutBtn2"><span class="ico" data-ico="logout"></span><span>Salir</span></button>
  </nav>
</div>
<div id="layer"></div>
<div id="toasts" aria-live="polite"></div>

<script src="js/data.js"></script>
<script src="js/sfx.js"></script>
<script src="js/app.js"></script>
</body>
</html>
